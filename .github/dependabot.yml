version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    labels:
      - dependabot
      - actions
    schedule:
      interval: monthly
    target-branch: "dev"

  - package-ecosystem: npm
    directory: /
    labels:
      - dependabot
      - npm
    schedule:
      interval: monthly
    target-branch: "dev"
    groups:
      patches:
        update-types:
        - "minor"
        - "patch"
